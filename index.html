<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Plume: seed life under the ice</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04080d; overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #cfe6ee; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em; }
      #loading h1 { font: 700 56px/1 "Oswald", "Arial Narrow", system-ui, sans-serif; letter-spacing: .04em; margin: 0 0 6px; color: #fff; }
      #loading p { margin: 0 0 28px; color: #73c7d9; }
      #bar { width: min(420px, 70vw); height: 4px; background: #13232d; border-radius: 2px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: linear-gradient(90deg, #4fd2e3, #ffcc6b); transition: width .2s; }
      #warning { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); max-width: 80vw; z-index: 2; }
      #warning div { padding: 10px 14px; border-radius: 6px; margin-bottom: 6px; color: #111; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loading"><h1>PLUME</h1><p>Seed life under the ice. Make it provable.</p><div id="bar"><div id="fill"></div></div></div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#game");
      function unityShowBanner(msg, type) {
        var box = document.querySelector("#warning"), div = document.createElement("div");
        div.textContent = msg;
        div.style.background = type == "error" ? "#ff7a6b" : "#ffd36b";
        box.appendChild(div);
        if (type != "error") setTimeout(function () { box.removeChild(div); }, 5000);
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/BuildWeb.data.unityweb",
        frameworkUrl: buildUrl + "/BuildWeb.framework.js.unityweb",
        codeUrl: buildUrl + "/BuildWeb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Plume",
        productName: "Plume",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // Keep saves and settings across visits (they live in the browser's IndexedDB).
        autoSyncPersistentDataPath: true,
        // Sharp on high-DPI screens without paying for 3x/4x phone pixel ratios.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/BuildWeb.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#fill").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) { unityShowBanner(message, "error"); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
